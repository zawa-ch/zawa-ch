<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Log In</title>
</head>

<body>
	<div
		style="display: flex; flex-flow: column; align-items: center; justify-content: center; width: 100vw; height: 100vh;">
		<div
			style="display: flex; flex-flow: column; width: calc(100% / 3); height: calc(100% / 3); border: 1px solid black; padding: 8pt; align-items: center;">
			<noscript>
				<code>
					Javascript Required
				</code>
			</noscript>
			<h1 style="text-align: center;">Login</h1>
			<form name="loginform" id="loginform" action="">
				<p>
					<label for="user_login">User name or Email Address</label>
					<input type="text" name="log" id="user_login" class="input" size="20" autocapitalize="off"
						autocomplete="username" required="required" />
				</p>
				<input />
			</form>
		</div>
	</div>
</body>

</html>
